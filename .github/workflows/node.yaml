name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22.x
        # Matches the runtime in companion/manifest.json
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Prepare module
        run: |
          corepack enable
          yarn install
        env:
          CI: true
      - name: Build and check types
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
